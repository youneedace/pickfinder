<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Betting Analytics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Pro-Pick-Analytics</h1>
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search for a player...">
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="best-picks">
                <h2>🔥 Trending Picks</h2>
                <div class="pick-card">
                    <div class="pick-player">
                        <img src="https://via.placeholder.com/40" alt="Player"/>
                        <div>
                            <h3>LeBron James</h3>
                            <p>Los Angeles Lakers</p>
                        </div>
                    </div>
                    <div class="pick-details">
                        <p>Points</p>
                        <p class="projection">Over 25.5</p>
                        <p class="hit-rate">75% Hit Rate</p>
                    </div>
                </div>
                <div class="pick-card">
                    <div class="pick-player">
                        <img src="https://via.placeholder.com/40" alt="Player"/>
                        <div>
                            <h3>Stephen Curry</h3>
                            <p>Golden State Warriors</p>
                        </div>
                    </div>
                    <div class="pick-details">
                        <p>3-Pointers Made</p>
                        <p class="projection">Over 4.5</p>
                        <p class="hit-rate">80% Hit Rate</p>
                    </div>
                </div>
            </div>
            <div class="player-props-container">
                <h2>Player Props</h2>
                <div class="player-props-grid">
                    <!-- Player props will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
