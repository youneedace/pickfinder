
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/player.css">
</head>
<body>
    <div class="app-container">
        <!-- The sidebar is the same as index.html, but we will link back to the main page -->
        <aside class="sidebar">
             <div class="sidebar-header">
                <i class="fa-solid fa-chart-simple"></i>
                <h1>PickFinder</h1>
            </div>
            <nav class="sidebar-nav">
                <h3>Analysis</h3>
                <a href="index.html" class="active"><i class="fa-solid fa-chart-pie"></i> Props</a>
                <a href="#"><i class="fa-solid fa-scale-unbalanced-flip"></i> Discrepancies</a>
                <a href="#"><i class="fa-solid fa-users"></i> Players</a>
                <h3>Community</h3>
                <a href="#"><i class="fa-solid fa-fire"></i> Popular</a>
                <a href="#"><i class="fa-solid fa-star"></i> Pick Builder</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="sidebar-btn"><i class="fa-solid fa-video"></i> Video Guide</a>
                <a href="#" class="sidebar-btn discord"><i class="fa-brands fa-discord"></i> Get Discord Access</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="player-header">
                <a href="index.html" class="back-button"><i class="fa-solid fa-arrow-left"></i> Back</a>
                <div class="player-info">
                    <!-- Player photo will be loaded here -->
                    <img id="player-photo" src="https://via.placeholder.com/60" alt="Player Photo">
                    <div>
                        <h1 id="player-name">Tobias Harris</h1>
                        <p id="player-details">PF 6' 8"</p>
                        <p id="player-game-info">DET @ CLE - Mon 7:00PM</p>
                    </div>
                </div>
            </div>

            <div class="odds-bar">
                <!-- Sportsbook logos and odds -->
                <div class="odds-item"><img src="https://a.espncdn.com/i/sportsbook/logo-fanduel-44.png" alt="FanDuel"><span>O -130, U -110</span></div>
                <div class="odds-item"><img src="https://a.espncdn.com/i/sportsbook/logo-draftkings-44.png" alt="DraftKings"><span>O -125, U -115</span></div>
                <div class="odds-item"><img src="https://a.espncdn.com/i/sportsbook/logo-betmgm-44.png" alt="BetMGM"><span>O -139, U -119</span></div>
            </div>

            <div class="player-dashboard">
                <div class="chart-section">
                    <div class="stat-selector">
                        <!-- Stat tabs like Pts+Rebs, ASTS, etc. -->
                        <button class="stat-tab active">PR</button>
                        <button class="stat-tab">PA</button>
                        <button class="stat-tab">PRA</button>
                        <button class="stat-tab">PTS</button>
                        <button class="stat-tab">REB</button>
                        <button class="stat-tab">AST</button>
                    </div>
                    <div class="line-selector">
                        <h2 id="stat-name">Pts+Rebs</h2>
                        <div class="line-value">24.5</div>
                    </div>
                    <div class="hit-rate-summary">
                        <!-- Hit rate stats -->
                        <div>L5<span id="hr-l5">100%</span></div>
                        <div>L10<span id="hr-l10">90%</span></div>
                        <div>SZN<span id="hr-szn">67%</span></div>
                    </div>
                    <div class="game-log-chart" id="game-log-chart">
                        <!-- Bars for the chart will be generated by JS -->
                    </div>
                    <div class="supporting-stats">
                        <h3>Supporting Stats</h3>
                        <div id="supporting-stats-grid">
                            <!-- Supporting stats will be loaded here -->
                        </div>
                    </div>
                </div>
                <div class="analytics-sidebar">
                    <div class="widget">
                        <h4>Win Predictor</h4>
                        <div id="win-predictor"></div>
                    </div>
                    <div class="widget">
                        <h4>Matchup Odds</h4>
                        <div id="matchup-odds"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/player.js"></script>
</body>
</html>
